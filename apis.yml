description: >-
  DeepL is an AI-powered translation service that delivers high-quality machine translation between dozens of languages,
  with support for context-aware translation, document translation, glossaries, and rephrasing/improvement via DeepL
  Write. The DeepL API is offered in Pro and Free tiers and exposes endpoints for text translation, document
  translation, glossaries, language metadata, usage, and write/rephrase.
apis:
- aid: deepl:deepl-voice-api
  name: DeepL Voice API
  description: >-
    The DeepL Voice API provides real-time speech transcription and translation. A POST to /v3/voice/realtime
    issues an ephemeral token and WebSocket streaming URL; clients then open a WSS channel to stream source
    audio chunks and receive incremental source-language transcriptions, translated transcriptions, and
    (closed beta) synthesized translated audio. There is no documented webhook callback URL on the REST
    APIs; document translation remains polling-based.
  humanURL: https://developers.deepl.com/api-reference/voice
  baseURL: https://api.deepl.com/v3
  tags:
  - Real-Time
  - Speech-to-Text
  - Streaming
  - Transcription
  - Translation
  - Voice
  - WebSocket
