- aid: deepl:deepl-translationmemories-api
  name: DeepL Translation Memories API
  description: >-
    The translation memory endpoints allow you to manage your account's translation memories, used to
    store

    and reuse previously created translations. You can list and retrieve translation memories, page through

    their stored segments, create one by importing a TMX file, export one back to TMX, and delete one.

    Editing the contents of an existing translation memory is not supported; import a new one instead.


    Importing and exporting run as background jobs. Create the job, then poll

    `GET /v3/translation_memories/jobs/{job_id}` until it reports `completed`.


    Translation memories can be used in text translation requests by

    specifying the `translation_memory_id` parameter to denote a specific translation memory and the

    `translation_memory_threshold` which defines the minimum matching percentage required for a translation
    memory

    segment to be applied (recommended to be 75% or higher). A translation request fails with `404` if
    the

    translation memory does not exist or does not cover the requested language pair.
  humanURL: https://developers.deepl.com/api-reference/voice
  baseURL: https://api.deepl.com/v3
  tags:
  - TranslationMemories
  properties:
  - type: OpenAPI
    url: openapi/deepl-translationmemories-api-openapi.yml
  - type: Documentation
    url: https://developers.deepl.com/docs
  - type: Reference
    url: https://developers.deepl.com/docs/api-reference
  - type: JSONSchema
    url: json-schema/deepl-translation.json
  - type: JSONSchema
    url: json-schema/deepl-glossary.json
