openapi: 3.2.0
info:
  title: DeepL API Documentation Style Rules API
  description: 'The DeepL API provides programmatic access to DeepL’s language AI technology.


    Note: this OpenAPI spec is embedded into our API documentation and has shortened descriptions.'
  termsOfService: https://www.deepl.com/pro-license
  contact:
    name: DeepL - Contact us
    url: https://www.deepl.com/contact-us
  version: 3.13.0
servers:
- url: https://api.deepl.com
  description: DeepL API Pro
- url: https://api-free.deepl.com
  description: DeepL API Free
tags:
- name: Style Rules
paths:
  /v3/style_rules:
    get:
      summary: Retrieve style rule lists
      operationId: getStyleRuleLists
      description: 'List the style rule lists in your account. Results are paginated. Set `detailed` to

        include each list''s configured rules and custom instructions.'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
        description: The index of the first page to return. Use with `page_size` to get the next page of rule lists
      - name: page_size
        in: query
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 25
        description: The maximum number of style rule lists to return.
      - name: detailed
        in: query
        schema:
          type: boolean
          default: false
        description: Determines if the rule list's `configured_rules` and `custom_instructions` should be included in the response body.
      responses:
        '200':
          description: JSON object containing the style rule lists.
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  style_rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/StyleRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
    post:
      summary: Create a style rule list
      operationId: createStyleRuleList
      description: 'Create a style rule list for a single language, optionally with its configured rules

        and custom instructions. The `language` can be a root code such as `de` or a variant

        code such as `de-CH`. Use the returned `style_id` with the translation endpoints

        to apply the list.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - language
              properties:
                name:
                  $ref: '#/components/schemas/StyleRuleName'
                  x-default: My style rules
                language:
                  $ref: '#/components/schemas/StyleRuleLanguage'
                  x-default: de
                configured_rules:
                  $ref: '#/components/schemas/ConfiguredRules'
                custom_instructions:
                  type: array
                  description: Array of custom instruction objects
                  maxItems: 200
                  items:
                    type: object
                    required:
                    - label
                    - prompt
                    properties:
                      label:
                        type: string
                        description: Label for the custom instruction
                      prompt:
                        type: string
                        description: Instruction text
                        maxLength: 300
                      source_language:
                        type: string
                        description: Optional source language code
            example:
              name: My style rules
              language: de
              configured_rules:
                style_and_tone:
                  abbreviations: use_abbreviations_and_symbols
                  short_vs_long_words: use_short_words
                punctuation:
                  apostrophe: use_curly_apostrophes
              custom_instructions:
              - label: Currency custom instruction
                prompt: Have currency symbols before the numerical value (e.g. $100, €100)
                source_language: en
      responses:
        '201':
          description: Style rule list created successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '456':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
  /v3/style_rules/{style_id}:
    get:
      summary: Get a style rule list
      operationId: getStyleRuleList
      description: Retrieve a single style rule list, including its configured rules and custom instructions.
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      responses:
        '200':
          description: Style rule list details
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
    patch:
      summary: Update a style rule list's name
      operationId: updateStyleRuleList
      description: Rename a style rule list. This does not change its configured rules or custom instructions.
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/StyleRuleName'
      responses:
        '200':
          description: Style rule list updated successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '456':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
    delete:
      summary: Delete a style rule list
      operationId: deleteStyleRuleList
      description: 'Delete a style rule list and its custom instructions. Requests that reference the

        deleted `style_id` fail afterwards.'
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      responses:
        '204':
          description: Style rule list deleted successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
  /v3/style_rules/{style_id}/configured_rules:
    put:
      summary: Replace configured rules for a style rule list
      operationId: updateStyleRuleConfiguredRules
      description: 'Replace the full set of configured rules on a style rule list. Rules not included in

        the request are removed, so send the complete set you want to keep.'
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguredRules'
            example:
              dates_and_times:
                calendar_era: use_bc_and_ad
              punctuation:
                periods_in_academic_degrees: do_not_use
      responses:
        '200':
          description: Configured rules updated successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleRuleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
  /v3/style_rules/{style_id}/custom_instructions:
    post:
      summary: Create a custom instruction
      operationId: createCustomInstruction
      description: 'Add a custom instruction to a style rule list to express a style preference that the

        predefined rules do not cover. Instructions apply to text in the given source language.'
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              - prompt
              properties:
                label:
                  type: string
                  description: Label for the custom instruction
                  maxLength: 100
                  x-default: Currency custom instruction
                prompt:
                  type: string
                  description: Instruction text
                  maxLength: 300
                  x-default: Have currency symbols before the numerical value (e.g. $100, €100)
                source_language:
                  type: string
                  description: Optional source language code
            example:
              label: Currency custom instruction
              prompt: Have currency symbols before the numerical value (e.g. $100, €100)
      responses:
        '201':
          description: Custom instruction created successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomInstruction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '456':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
  /v3/style_rules/{style_id}/custom_instructions/{instruction_id}:
    get:
      summary: Get a custom instruction
      operationId: getCustomInstruction
      description: Retrieve a single custom instruction from a style rule list.
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the custom instruction
      responses:
        '200':
          description: Custom instruction details
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomInstruction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
    put:
      summary: Replace a custom instruction
      operationId: updateCustomInstruction
      description: 'Replace a custom instruction. Send every field you want to keep, because omitted

        fields are overwritten.'
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the custom instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              - prompt
              properties:
                label:
                  type: string
                  description: Updated label for the custom instruction
                  maxLength: 100
                prompt:
                  type: string
                  description: Updated instruction text
                  maxLength: 300
                source_language:
                  type: string
                  description: Optional source language code
      responses:
        '200':
          description: Custom instruction updated successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomInstruction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
    delete:
      summary: Delete a custom instruction
      operationId: deleteCustomInstruction
      description: Delete a custom instruction from a style rule list. The rest of the list is unchanged.
      parameters:
      - name: style_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the style rule list
      - name: instruction_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the custom instruction
      responses:
        '204':
          description: Custom instruction deleted successfully
          headers:
            X-Trace-ID:
              $ref: '#/components/headers/X-Trace-ID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenScoped'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - auth_header: []
      tags:
      - Style Rules
components:
  responses:
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: Quota exceeded. The character limit has been reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Resource currently unavailable. Try again later.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - $ref: '#/components/schemas/InfrastructureErrorResponse'
    ForbiddenScoped:
      description: Authorization failed. Please supply a valid `DeepL-Auth-Key` via the `Authorization` header. This error is also returned when the API key is scoped but does not include the scope required for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests. Please wait and resend your request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request. Please check error message and your parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - $ref: '#/components/schemas/InfrastructureErrorResponse'
    Unauthorized:
      description: Authorization failed. Please supply a valid `DeepL-Auth-Key` via the `Authorization` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: A human-readable description of the error.
        code:
          type: string
          description: A machine-readable identifier for the error, when available. Clients should match on this value rather than on `message` when branching on error types.
          example: invalid_content_type
    CustomInstruction:
      description: All enabled custom instructions for the style rule list
      type: object
      required:
      - id
      - label
      - prompt
      properties:
        id:
          type: string
          description: Unique identifier for the custom instruction
          example: 68fdb803-c013-4e67-b62e-1aad0ab519cd
        label:
          type: string
          description: Name associated with the custom instruction
          example: Currency custom instruction
        prompt:
          type: string
          description: Prompt of the custom instruction
          example: Have currency symbols before the numerical value (e.g. $100, €100)
        source_language:
          type: string
          description: Optional source language of the custom instruction
          example: en
    InfrastructureErrorResponse:
      description: 'Error body returned by DeepL''s edge infrastructure for failures that occur before a request reaches the API itself. The message is nested under `error`, unlike the application-level `ErrorResponse`. Clients that parse error bodies should handle both shapes.

        '
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: A human-readable description of the error.
              example: Bad Gateway.
    StyleId:
      type: string
      description: A unique ID assigned to a style rule list.
      example: bd0a38f3-1831-440b-a8dd-2c702e2325ab
    StyleRuleName:
      description: Name associated with the style rule list.
      type: string
    StyleRuleList:
      type: object
      required:
      - style_id
      - name
      - creation_time
      - updated_time
      - language
      - version
      properties:
        style_id:
          $ref: '#/components/schemas/StyleId'
        name:
          $ref: '#/components/schemas/StyleRuleName'
        creation_time:
          description: 'The creation time of the style rule list in the ISO 8601-1:2019 format (e.g.: `2021-08-03T14:16:18.329Z`).'
          type: string
          format: date-time
        updated_time:
          description: 'The time of the style rule list when it was last updated in the ISO 8601-1:2019 format (e.g.: `2022-08-03T14:16:18.329Z`).'
          type: string
          format: date-time
        language:
          $ref: '#/components/schemas/StyleRuleLanguage'
        version:
          description: The version of the style rule list. Incremented when the style rule list is updated.
          type: integer
          example: 13
        configured_rules:
          $ref: '#/components/schemas/ConfiguredRules'
        custom_instructions:
          type: array
          description: List of custom instructions enabled for the style rule list.
          items:
            $ref: '#/components/schemas/CustomInstruction'
    StyleRuleLanguage:
      description: 'The target language the style rule list applies to. Codes are matched case-insensitively;

        the response returns the canonical form (for example `de-CH`).


        A root code (for example `en`) applies to that language and all of its variants. A variant

        code (for example `en-GB`) applies only when `target_lang` is that variant.


        Variant lists for `de-CH`, `fr-CA`, `pt-BR`, and `pt-PT` are generally available. Variant

        lists for `de-DE`, `en-GB`, `en-US`, `es-419`, `es-ES`, `fr-FR`, `zh-Hans`, and `zh-Hant`

        are in beta. The current list and the status of each language are returned by

        [`GET /v3/languages?resource=style_rules&include=beta`](/docs/languages/using-the-languages-api).'
      type: string
      enum:
      - ar
      - bg
      - cs
      - da
      - de
      - de-CH
      - de-DE
      - el
      - en
      - en-GB
      - en-US
      - es
      - es-419
      - es-ES
      - et
      - fi
      - fr
      - fr-CA
      - fr-FR
      - he
      - hu
      - id
      - it
      - ja
      - ko
      - lt
      - lv
      - nb
      - nl
      - pl
      - pt
      - pt-BR
      - pt-PT
      - ro
      - ru
      - sk
      - sl
      - sv
      - th
      - tr
      - uk
      - vi
      - zh
      - zh-Hans
      - zh-Hant
    ConfiguredRules:
      description: The enabled rules for the style rule list including what option was selected for each rule. This schema combines rules from all supported languages.
      type: object
      properties:
        dates_and_times:
          type: object
          properties:
            calendar_era:
              type: string
              description: Formatting options for Calendar Era
              enum:
              - use_bc_and_ad
              - use_bce_and_ce
            centuries:
              type: string
              description: Formatting options for Centuries
              enum:
              - spell_out
              - use_arabic_numerals
              - use_numerals
              - use_roman_numerals
            date_format:
              type: string
              description: Formatting options for Date Format
              enum:
              - use_dd_period_mm_period_yy_with_leading_zeros_for_single_digit_days_and_months
              - use_dd_period_mm_period_yyyy
              - use_dd_period_mm_period_yyyy_with_leading_zeros_for_single_digit_days_and_months
              - use_dd_period_space_abbreviated_month_yyyy_with_abbreviations_jan_period_feb_period_mrz_period_apr_period_mai_jun_period_jul_period_aug_period_sep_period_okt_period_nov_period_dez_period_without_leading_zeros_for_single_digit_days
              - use_dd_period_space_abbreviated_month_yyyy_with_abbreviations_jan_period_febr_period_maerz_apr_period_mai_juni_juli_aug_period_sept_period_okt_period_nov_period_dez_period_without_leading_zeros_for_single_digit_days
              - use_dd_period_space_month_yyyy_without_leading_zeros_for_single_digit_days
              - use_dd_slash_mm_slash_yyyy
              - use_dd_slash_mm_slash_yyyy_with_leading_zeros_for_single_digit_days_and_months
              - use_dd_space_spelled_out_month_space_yyyy
              - use_dd_space_spelled_out_month_space_yyyy_and_use_spanish_word_septiembre_for_ninth_month
              - use_dd_space_spelled_out_month_space_yyyy_and_use_spanish_word_setiembre_for_ninth_month
              - use_dd_space_spelled_out_month_space_yyyy_without_leading_zeros_for_single_digit_days
              - use_historical_eras_and_write_numbers_in_chinese_followed_by_chinese_word_公元前_or_公元后_with_arabic_numerals_in_parentheses
              - use_mm_slash_dd_slash_yyyy_with_leading_zeros_for_single_digit_days_and_months
              - use_numerals_only_with_leading_zero_for_single_digits
              - use_numerals_only_without_leading_zero_for_single_digits
              - use_spelled_out_month_space_dd_comma_space_yyyy_and_use_spanish_word_septiembre_for_ninth_month
              - use_spelled_out_month_space_dd_comma_space_yyyy_without_leading_zeros_for_single_digit_days
              - use_traditional_calendar_system_with_chinese_numbers
              - use_yyyy_chinese_word_年_mm_chinese_word_月_dd_chinese_word_日_with_chinese_numbers
